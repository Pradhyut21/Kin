[profile.default]
src = "src"
out = "out"
libs = []
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# The regression harness embeds all deployments; production contracts fit standard EVM size limits.
code_size_limit = 100000

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
